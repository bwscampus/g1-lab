[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-lab"
version = "0.1.0"
description = "Policies for the Unitree G1 and the check / sim / robot environments that run them"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "jsonschema>=4",
]

[project.optional-dependencies]
# MuJoCo viewer stage. unitree_sdk2py is not on PyPI; install it from
# https://github.com/unitreerobotics/unitree_sdk2_python for --env robot.
sim = ["mujoco>=3.2", "mujoco-menagerie"]
# Camera feed. unitree_webrtc_connect is not on PyPI either; install it from
# https://github.com/legion1581/go2_webrtc_connect for --env robot with a camera policy.
camera = ["aiortc", "av", "opencv-python"]
dev = ["pytest", "opencv-python"]

[project.scripts]
g1 = "run:main"

[tool.setuptools]
py-modules = ["agent", "behaviors", "camera", "config", "decider", "episode", "hf", "perception", "policy", "run", "routines", "scene", "skills", "targets", "vision", "worker"]
packages = ["envs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
